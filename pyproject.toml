[project]
name = "autoapply"
version = "0.1.0"
description = "Candidatura automática a vagas Easy Apply do LinkedIn"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.64.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "selectolax>=1.0.1",
    "typer>=0.27.3",
]

[project.scripts]
autoapply = "autoapply.main:app"

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-playwright>=0.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
